# XcodeGen definition for the native ToHuus iPhone app.
# Generate: brew install xcodegen && cd ios && xcodegen generate
# Signing: set TOHUUS_TEAM_ID below (or pass it to xcodebuild) – Till's individual team is the one Equilo uses.
name: ToHuus
options:
  bundleIdPrefix: de.heidrichdigital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    TOHUUS_TEAM_ID: ""            # placeholder – fill in on the Mac (Apple Developer team id)
    DEVELOPMENT_TEAM: "$(TOHUUS_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: false
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
targets:
  ToHuus:
    type: application
    platform: iOS
    sources:
      - path: ToHuus
      - path: Shared
    dependencies:
      - target: ToHuusShare
        embed: true
      - sdk: StoreKit.framework
      - sdk: VisionKit.framework
      - sdk: Speech.framework
    info:
      path: ToHuus/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: de.heidrichdigital.tohuus
            CFBundleURLSchemes: [tohuus]
        NSCameraUsageDescription: "ToHuus uses the camera to scan barcodes, receipts and the QR code of your own server."
        NSMicrophoneUsageDescription: "ToHuus uses the microphone when you speak to the assistant."
        NSSpeechRecognitionUsageDescription: "Your words are turned into text on your iPhone so the assistant can understand them."
        NSPhotoLibraryAddUsageDescription: "ToHuus can save images to your photo library."
    entitlements:
      path: ToHuus/ToHuus.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus
        PRODUCT_NAME: ToHuus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: ToHuus/Info.plist
        GENERATE_INFOPLIST_FILE: false
  ToHuusShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ToHuusShare
      - path: Shared
      - path: ToHuus/Resources/Localizable.xcstrings
      - path: ToHuus/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ToHuusShare/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ToHuusShare/ToHuusShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.share
        INFOPLIST_FILE: ToHuusShare/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: true
  ToHuusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ToHuusTests
    dependencies:
      - target: ToHuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ToHuus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ToHuus"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ToHuus:
    build:
      targets:
        ToHuus: all
        ToHuusTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ToHuus.storekit
    test:
      config: Debug
      targets:
        - ToHuusTests
    archive:
      config: Release
