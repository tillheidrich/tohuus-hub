# XcodeGen definition for the native ToHuus iPhone app.
# Generate: brew install xcodegen && cd ios && xcodegen generate
# Signing: set TOHUUS_TEAM_ID below (or pass it to xcodebuild) – the same individual team as Equilo.
name: ToHuus
options:
  bundleIdPrefix: de.heidrichdigital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    TOHUUS_TEAM_ID: "FVS7WVTQ67"  # individual team – same as Equilo
    DEVELOPMENT_TEAM: "$(TOHUUS_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_EMIT_LOC_STRINGS: false
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
targets:
  ToHuus:
    type: application
    platform: iOS
    sources:
      - path: ToHuus
      - path: Shared
    dependencies:
      - target: ToHuusShare
        embed: true
      - target: ToHuusWidget
        embed: true
      - target: ToHuusWatch
        embed: true
      - sdk: StoreKit.framework
      - sdk: VisionKit.framework
      - sdk: Speech.framework
    info:
      path: ToHuus/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation, Split View, Slide Over and Stage Manager (no UIRequiresFullScreen)
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # http://localhost and LAN addresses for self-hosted servers / development
        CFBundleURLTypes:
          - CFBundleURLName: de.heidrichdigital.tohuus
            CFBundleURLSchemes: [tohuus]
        NSCameraUsageDescription: "ToHuus uses the camera to scan barcodes, receipts and paper lists."
        # the share sheet's "Save Image" (leftover and meal-box cards, printer previews) needs this key, or the app is terminated
        # a self-hosted server at a home address (http://192.168.…, tohuus.local) triggers the local network prompt
        NSLocalNetworkUsageDescription: "Only if your ToHuus server runs at home: ToHuus connects to it in your home network."
        NSPhotoLibraryAddUsageDescription: "ToHuus can save images to your photo library."
        NSCalendarsWriteOnlyAccessUsageDescription: "ToHuus only adds an entry when you tap “Add to calendar” and save it. ToHuus does not read your calendar."
        # "Einkauf läuft" on the lock screen and in the Dynamic Island (LiveTripActivity.swift)
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "ToHuus uses the microphone only while you speak to the assistant or dictate for the list. If your iPhone can't turn speech into text, the recording goes to ToHuus to be turned into text."
        NSSpeechRecognitionUsageDescription: "Your words are turned into text so the assistant understands you – on your iPhone where possible, otherwise by Apple's speech recognition."
        NSLocationWhenInUseUsageDescription: "Only if you switch on the hint in the shop: ToHuus saves where your shops are. The places stay on your iPhone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Only if you switch on the hint in the shop: when you arrive at a shop you saved, ToHuus asks whether to open the list. Your location never leaves your iPhone."
    entitlements:
      path: ToHuus/ToHuus.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
        # APNs: Xcode switches this to "production" when exporting for TestFlight/App Store
        aps-environment: development
        # Sign in with Apple (enable the capability for de.heidrichdigital.tohuus in the developer account)
        com.apple.developer.applesignin: [Default]
        # passkeys of ToHuus Cloud accounts (served: /.well-known/apple-app-site-association)
        # applinks: QR label links ".../q/<code>" open the app on the cloud host
        com.apple.developer.associated-domains: ["webcredentials:cloud.tohuus.heidrich-digital.de", "applinks:cloud.tohuus.heidrich-digital.de"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus
        PRODUCT_NAME: ToHuus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: ToHuus/Info.plist
        GENERATE_INFOPLIST_FILE: false
  ToHuusShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ToHuusShare
      - path: Shared
        excludes: [WatchLink.swift, NotifyKit.swift]
      - path: ToHuus/Resources/Localizable.xcstrings
      - path: ToHuus/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ToHuusShare/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ToHuusShare/ToHuusShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.share
        INFOPLIST_FILE: ToHuusShare/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: true
  ToHuusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ToHuusWidget
      - path: Shared
        excludes: [WatchLink.swift, NotifyKit.swift]
      - path: ToHuus/Resources/Localizable.xcstrings
      - path: ToHuus/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: ToHuusWidget/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ToHuusWidget/ToHuusWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.widget
        INFOPLIST_FILE: ToHuusWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: true
  # ---------------- Apple Watch (same naming as Equilo: .watchkitapp / .watchkitapp.watchwidgets) ----------------
  ToHuusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ToHuusWatch
      - path: Shared
        excludes: [UploadQueue.swift]
      - path: ToHuus/Core/API
        excludes: [EventStream.swift]
      - path: ToHuus/Core/Models
      - path: ToHuus/Core/Offline
      - path: ToHuus/Resources/Localizable.xcstrings
      - path: ToHuus/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: ToHuusWatchWidgets
        embed: true
    entitlements:
      path: ToHuusWatch/ToHuusWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        PRODUCT_NAME: "ToHuus Watch App"
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: ToHuus
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.heidrichdigital.tohuus
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "ToHuus uses the microphone when you dictate something for the list."
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WATCH_APP"
  ToHuusWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ToHuusWatchWidgets
      - path: Shared/WidgetSnapshot.swift
      - path: Shared/SharedConfig.swift
      - path: Shared/Keychain.swift
      - path: ToHuus/Resources/Localizable.xcstrings
      - path: ToHuus/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: ToHuusWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: ToHuus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [de, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ToHuusWatchWidgets/ToHuusWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.heidrichdigital.tohuus
    settings:
      base:
        # ".complication" was already taken at Apple for Equilo (05.10.2026) – ".watchwidgets" worked
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.watchkitapp.watchwidgets
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: ToHuusWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: true
  ToHuusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ToHuusTests
      # StoreKit Testing (SKTestSession) – the same configuration the Run action uses
      - path: StoreKit/ToHuus.storekit
        buildPhase: resources
    dependencies:
      - target: ToHuus
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ToHuus.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ToHuus"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # accessibility audit of the main screens (XCUIApplication.performAccessibilityAudit, iOS 17)
  ToHuusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ToHuusUITests
    dependencies:
      - target: ToHuus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.heidrichdigital.tohuus.uitests
        GENERATE_INFOPLIST_FILE: true
        # test code only: the audit handler closure is not Sendable in the XCTest SDK
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_TARGET_NAME: ToHuus
schemes:
  ToHuus:
    build:
      targets:
        ToHuus: all
        ToHuusTests: [test]
        ToHuusUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/ToHuus.storekit
    test:
      config: Debug
      targets:
        - ToHuusTests
        - ToHuusUITests
    archive:
      config: Release
  ToHuusWatch:
    build:
      targets:
        ToHuusWatch: all
    run:
      config: Debug
