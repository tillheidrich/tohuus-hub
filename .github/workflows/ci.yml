name: CI
# Gate G2 of the security standard (SECURITY.md): secrets, dependencies, types, tests, build.
# Every third-party action is pinned to a commit SHA (version in the comment); the first step fails otherwise.
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read # gitleaks lists the commits of a pull request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the pushed commits, not only the last one
      - name: Actions pinned to commit SHAs
        run: |
          bad=$(grep -RnE '^\s*-?\s*uses:\s*[^ #]+@' .github/workflows | grep -vE 'uses:\s*[^ #]+@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then echo "::error::uses: without a 40-character commit SHA"; echo "$bad"; exit 1; fi
      - name: Secrets (gitleaks, allowlist in .gitleaks.toml)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      # same tools as the Docker image (pdftotext for PDF receipts, tesseract for photos)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: npm ci
      - name: Dependencies (npm audit, shipped code only)
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc -p .
      - run: npm test
      - run: npm run build
