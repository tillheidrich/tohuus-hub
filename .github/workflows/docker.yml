name: Docker image
# Built only after a green CI run (gate G2, SECURITY.md): pushes to main → :latest, tags v* → :<version>.
# Actions are pinned to commit SHAs (version in the comment).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: ubuntu-latest
    steps:
      - id: src
        name: Commit and ref that CI tested
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          ref="${RUN_REF:-$GITHUB_REF_NAME}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo "version=${ref#v}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.src.outputs.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ steps.src.outputs.ref == 'main' }}
            type=raw,value=${{ steps.src.outputs.version }},enable=${{ steps.src.outputs.version != '' }}
            type=raw,value=sha-${{ steps.src.outputs.short }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
